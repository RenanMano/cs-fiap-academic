<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Gráficos para variável qualitativa</title>
<desc id="d">Mesmos dados (20 respostas Sim e 45 Não) em dois gráficos: setores com 69,23% para Não e 30,77% para Sim, e barras com alturas 20 e 45.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF781F"/><stop offset=".5" stop-color="#FF4500"/><stop offset="1" stop-color="#E60000"/></linearGradient></defs>
<rect width="760" height="380" rx="18" fill="#0D1117"/>
<rect width="760" height="6" rx="3" fill="url(#g)"/>
<g font-family="Fira Code, Consolas, monospace">
