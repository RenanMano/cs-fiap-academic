<text x="432.0" y="242.0" font-size="11" fill="#CBD5E1" text-anchor="end" font-weight="400">20</text>
<line x1="440" y1="192.0" x2="700" y2="192.0" stroke="#30363D"/>
<text x="432.0" y="196.0" font-size="11" fill="#CBD5E1" text-anchor="end" font-weight="400">30</text>
<line x1="440" y1="146.0" x2="700" y2="146.0" stroke="#30363D"/>
<text x="432.0" y="150.0" font-size="11" fill="#CBD5E1" text-anchor="end" font-weight="400">40</text>
