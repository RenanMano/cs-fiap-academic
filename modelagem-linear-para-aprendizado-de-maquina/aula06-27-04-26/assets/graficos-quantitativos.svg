<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Histograma e boxplot da variável quantitativa</title>
<desc id="d">Histograma com 3 classes de largura 2 (12 a 14: 1; 14 a 16: 9; 16 a 18: 5) e boxplot com mínimo 12, Q1 15, mediana 15, Q3 17 e máximo 18, sem outliers.</desc>
