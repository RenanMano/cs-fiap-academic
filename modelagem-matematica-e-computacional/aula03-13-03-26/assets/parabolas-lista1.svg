<title id="t">Parábolas do exercício 8 da Lista 1</title>
<desc id="d">Quatro parábolas: a) x² − 2x + 1, côncava para cima com vértice (1; 0); b) −x² + 3x − 3, côncava para baixo, vértice (1,5; −0,75), sem raízes; c) x² − 3x + 4, côncava para cima, vértice (1,5; 1,75), sem raízes; d) −x² + 10x − 25, côncava para baixo, vértice (5; 0), tocando o eixo x em x = 5.</desc>
