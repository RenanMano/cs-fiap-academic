<title id="t">Retas secantes convergindo para a reta tangente</title>
<desc id="d">Parábola y = x² com o ponto A(2, 4). Três retas secantes tracejadas ligam A a pontos D com x = 1, 1,5 e 1,9, com inclinações 3, 3,5 e 3,9. A reta tangente em A, y = 4x − 4, tem inclinação 4, igual à derivada em x = 2.</desc>
