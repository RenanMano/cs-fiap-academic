<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Limites laterais da função g do exercício 52</title>
<desc id="d">Gráfico por partes: a reta y = x até x = 1 (círculo vazio em (1, 1)), o ponto isolado g(1) = 3, a parábola 2 − x² de 1 a 2 (ponto cheio em (2, −2)) e a reta x − 3 depois de 2 (círculo vazio em (2, −1)). Em x = 1 os limites laterais valem 1, mas g(1) = 3; em x = 2 os laterais são −2 e −1, então o limite não existe.</desc>
