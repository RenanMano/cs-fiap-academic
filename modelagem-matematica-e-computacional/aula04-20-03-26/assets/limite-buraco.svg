<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Limite de (x² − 1)/(x − 1) quando x tende a 1</title>
<desc id="d">Gráfico da reta y = x + 1 com um buraco (círculo vazio) no ponto (1, 2), porque a função original não está definida em x = 1. Os valores f(0,9) = 1,9, f(0,99) = 1,99, f(1,01) = 2,01 e f(1,1) = 2,1 se aproximam de 2, que é o limite.</desc>
