<title id="t">Curva de Lorenz e Índice de Gini</title>
<desc id="d">Gráfico de 0 a 1 nos dois eixos com a reta de igualdade y = x tracejada, a curva de Lorenz ajustada L(x) = 0,7604·x elevado a 2,0926 abaixo dela e os seis pontos da tabela de renda acumulada (0; 0,03; 0,1; 0,22; 0,42; 1). A área entre as curvas, sombreada, vale cerca de 0,2541, e o Índice de Gini, o dobro, cerca de 0,508.</desc>
