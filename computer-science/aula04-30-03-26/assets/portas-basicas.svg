<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 270" width="770" height="270" role="img" aria-labelledby="t d">
<title id="t">Portas lógicas AND, OR, NOT</title>
<desc id="d">Símbolos ANSI das portas lógicas com a expressão booleana e a tabela-verdade de cada uma.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF781F"/><stop offset=".5" stop-color="#FF4500"/><stop offset="1" stop-color="#E60000"/></linearGradient></defs>
<rect width="770" height="270" rx="18" fill="#0D1117"/>
<rect width="770" height="6" rx="3" fill="url(#g)"/>
<g font-family="Fira Code, Consolas, monospace">
<text x="135.0" y="36" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="middle">AND</text>
<line x1="50" y1="69" x2="101" y2="69" stroke="#CBD5E1" stroke-width="2"/>
<line x1="50" y1="91" x2="101" y2="91" stroke="#CBD5E1" stroke-width="2"/>
<text x="40" y="74" font-size="13" fill="#CBD5E1" text-anchor="end">A</text>
<text x="40" y="96" font-size="13" fill="#CBD5E1" text-anchor="end">B</text>
<path d="M95 55 H130 A25 25 0 0 1 130 105 H95 Z" fill="#161B22" stroke="url(#g)" stroke-width="3"/>
<line x1="155" y1="80" x2="235" y2="80" stroke="#CBD5E1" stroke-width="2"/>
<text x="242" y="85" font-size="13" fill="#CBD5E1">Y</text>
<text x="135.0" y="133" font-size="13" fill="#FF781F" text-anchor="middle">Y = A · B</text>
<text x="135.0" y="159" font-size="13" fill="#CBD5E1" text-anchor="middle" xml:space="preserve">A  B  Y</text>
<text x="135.0" y="179" font-size="14" fill="#8B949E" text-anchor="middle" xml:space="preserve">0  0  0</text>
<text x="135.0" y="199" font-size="14" fill="#8B949E" text-anchor="middle" xml:space="preserve">0  1  0</text>
<text x="135.0" y="219" font-size="14" fill="#8B949E" text-anchor="middle" xml:space="preserve">1  0  0</text>
<text x="135.0" y="239" font-size="14" fill="#F8FAFC" text-anchor="middle" xml:space="preserve">1  1  1</text>
<text x="385.0" y="36" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="middle">OR</text>
<line x1="300" y1="69" x2="351" y2="69" stroke="#CBD5E1" stroke-width="2"/>
<line x1="300" y1="91" x2="351" y2="91" stroke="#CBD5E1" stroke-width="2"/>
<text x="290" y="74" font-size="13" fill="#CBD5E1" text-anchor="end">A</text>
<text x="290" y="96" font-size="13" fill="#CBD5E1" text-anchor="end">B</text>
<path d="M345 55 Q390 55 410 80 Q390 105 345 105 Q360 80 345 55 Z" fill="#161B22" stroke="url(#g)" stroke-width="3"/>
<line x1="410" y1="80" x2="485" y2="80" stroke="#CBD5E1" stroke-width="2"/>
<text x="492" y="85" font-size="13" fill="#CBD5E1">Y</text>
<text x="385.0" y="133" font-size="13" fill="#FF781F" text-anchor="middle">Y = A + B</text>
<text x="385.0" y="159" font-size="13" fill="#CBD5E1" text-anchor="middle" xml:space="preserve">A  B  Y</text>
<text x="385.0" y="179" font-size="14" fill="#8B949E" text-anchor="middle" xml:space="preserve">0  0  0</text>
<text x="385.0" y="199" font-size="14" fill="#F8FAFC" text-anchor="middle" xml:space="preserve">0  1  1</text>
<text x="385.0" y="219" font-size="14" fill="#F8FAFC" text-anchor="middle" xml:space="preserve">1  0  1</text>
<text x="385.0" y="239" font-size="14" fill="#F8FAFC" text-anchor="middle" xml:space="preserve">1  1  1</text>
<text x="635.0" y="36" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="middle">NOT</text>
<line x1="550" y1="80" x2="595" y2="80" stroke="#CBD5E1" stroke-width="2"/>
<text x="540" y="85" font-size="13" fill="#CBD5E1" text-anchor="end">A</text>
<path d="M595 55 L645 80 L595 105 Z" fill="#161B22" stroke="url(#g)" stroke-width="3"/>
<circle cx="651" cy="80" r="6" fill="#0D1117" stroke="#FF781F" stroke-width="3"/>
<line x1="657" y1="80" x2="735" y2="80" stroke="#CBD5E1" stroke-width="2"/>
<text x="742" y="85" font-size="13" fill="#CBD5E1">Y</text>
<text x="635.0" y="133" font-size="13" fill="#FF781F" text-anchor="middle">Y = A'</text>
<text x="635.0" y="159" font-size="13" fill="#CBD5E1" text-anchor="middle" xml:space="preserve">A  Y</text>
<text x="635.0" y="179" font-size="14" fill="#F8FAFC" text-anchor="middle" xml:space="preserve">0  1</text>
<text x="635.0" y="199" font-size="14" fill="#8B949E" text-anchor="middle" xml:space="preserve">1  0</text>
</g></svg>
